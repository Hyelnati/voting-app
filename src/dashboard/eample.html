<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <main class="flex flex-col gap-y-4">
      <header
        id="header"
        class="flex justify-between items-center py-4 px-6 sm:px-14 border-b relative z-10"
      >
        <img
          id="logo"
          class="h-7 w-[6.5rem]"
          src="../../public/Voter..png"
          alt="logo"
        />

        <!-- Desktop Content -->
        <div class="hidden sm:flex items-center gap-4">
          <img src="../../public/Avatars.svg" alt="avatar" />
          <h1 class="font-medium">
            Michael Henry <br />
            <span class="font-light text-sm">@member</span>
          </h1>

          <img
            src="../../public/Alt Arrow Down.svg"
            alt="dropdown"
            id="dropdownButton"
            class="cursor-pointer"
          />

          <div
            id="dropdownMenu"
            class="hidden my-6 flex-col p-4 rounded-md shadow-xl absolute top-12 mx-10 bg-white space-y-4"
          >
            <h1 class="flex gap-2 items-center">
              <img src="../../public/Lock Keyhole.svg" alt="lock" />Reset
              password
            </h1>
            <h1 class="text-[#E02424] flex gap-2 items-center">
              <img src="../../public/Log in.svg" alt="logout" />Sign out
            </h1>
          </div>
        </div>

        <!-- Hamburger Menu for Mobile -->
        <div class="flex sm:hidden">
          <img
            src="../../public/solar_hamburger-menu-linear.svg"
            alt="menu"
            id="mobileMenuButton"
            class="h-6 w-6 cursor-pointer"
          />
        </div>
      </header>

      <!-- Mobile Menu -->
      <div
        id="mobileMenu"
        class="hidden flex-col space-y-8 px-6 sm:hidden bg-white gap-9 shadow-lg -mt-6"
      >
        <div class="flex items-center p-4 border-[#A9DDC1] border-b-2">
          <img src="../../public/Avatars.svg" alt="avatar" class="pr-3" />
          <h1 class="font-medium">
            Michael Henry <br />
            <span class="font-light text-sm">@member</span>
          </h1>
        </div>

        <h1 class="text-[#28AA63] bg-[#EAFBF2] rounded-md p-2">Polls</h1>
        <h1 class="text-sm text-[#75808A]">Reset password</h1>
        <h1 class="text-[#E02424] flex items-center gap-2 pb-6">
          <img src="../../public/Log in.svg" alt="logout" />Sign out
        </h1>
      </div>

      <!-- <div class="flex items-center flex-col mt-32 gap-2">
        <img src="../../public/Empty States.svg" alt="empty state" />
        <h1 class="font-bold">There are no polls yet</h1>
        <h1>
          Once your admin starts creating polls, you<br />
          <span class="flex justify-center items-center"
            >can view them here.</span
          >
        </h1>
      </div> -->

      <div class="mx-12 mt-6">
        <div class="flex justify-between">
          <h1 class="text-xl font-bold">Ongoing Polls</h1>

          <h1
            class="text-[#28AA63] relative gap-1 text-right font-medium text-sm flex justify-center items-center"
          >
            View all
            <img src="../../public/Arrow - Right.svg" alt="" class="" />
          </h1>
        </div>

        <div
          id="pollsContainer"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-16"
        ></div>
        <div
          id="completedPolls"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-16"
        ></div>
      </div>
      <footer class="flex justify-center items-center space-x-2">
        <button id="prevBtn" class="rounded-xl bg-red-700 p-4">
          <img src="../../public/Arrow - Left 2.svg" alt="" class="" />
        </button>

        <div id="paginationNumbers" class="flex space-x-2"></div>

        <button id="nextBtn" class="rounded-xl bg-red-700 p-4">
          <img src="../../public/Arrow - Right 2.svg" alt="" class="" />
        </button>
      </footer>
    </main>
    <script src="./script/example.js" type="module"></script>
  </body>
</html>
