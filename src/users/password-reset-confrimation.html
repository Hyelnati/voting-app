<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-[#28AA63] h-screen flex justify-center items-center">
    <div class="bg-white rounded-lg shadow-lg p-8 max-w-w-[470px] mx-4">
      <img class="pb-5 mx-auto h-10" src="../../public/Voter..png" alt="logo" />
      <div
        class="gap-7 text-center mt-3 mb-10 font-basis-grotesque leading-[26px]"
      >

      <div> <img  class="pb-5 mx-auto h-[80px] w-[65px] shadow-none" src="../../public/Success 2.png" alt="success">
      </div>
        <h1 class="font-bold font text-2xl tracking[-0.01em] ">Password reset successful</h1>
        <h1 class="mt-2">Congratulation your voter account password have been reset <br> successfully</h1>
      </div>
       <div>
          <button
            type="submit"
            class="bg-[#28AA63] w-full text-white py-2 rounded-lg hover:bg-green-600 focus:ring-green-500 mt-6"
          >
            Go to dashboard
          </button>
        </div>


       

        </div>
       
      
    </div>

    <script>
      function togglePasswordIcon() {
        const passwordInput = document.getElementById('passwordInput')
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text'
        } else passwordInput.type = 'password'
      }
    </script>
  </body>
</html>
