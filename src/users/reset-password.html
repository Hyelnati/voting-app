<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-[#28AA63] h-screen flex justify-center items-center">
    <div class="bg-white rounded-lg shadow-lg p-8 max-w-w-[970px] mx-4">
      <img class="pb-5 mx-auto h-10" src="../../public/Voter..png" alt="logo" />
      <div
        class="gap-7 text-center mt-3 mb-10 font-basis-grotesque leading-[26px]"
      >
        <h1 class="font-bold font text-2xl tracking[-0.01em]">Sign in</h1>
        <h1 class="">Enter credentials to reset your password</h1>
      </div>

      <form action="" class="mt-5">
      <div class="mt-6">
          <label class="block text-sm text-gray-800 pb-1">Old password</label>
          <div class="relative">
            <input
              type="password"
              id="passwordInput"
              placeholder="Enter old password"
              class="rounded-lg focus:ring-[#28AA63] border-gray-300 py-2 px-4 border focus:outline-none focus:ring-2 focus:border-transparent w-full"
            />
            <img
              src="../../public/Password.svg"
              alt="password"
              class="absolute right-3 top-1/2 transform -translate-y-1/2 cursor-pointer"
              onclick="togglePasswordIcon()"
            />
          </div>

        <div class="mt-6">
          <label class="block text-sm text-gray-800 ">New Password</label>
          <div class="relative">
            <input
              type="password"
              id="passwordInput"
              placeholder="Enter new password"
              class="rounded-lg focus:ring-[#28AA63] border-gray-300 py-2 px-4 border focus:outline-none focus:ring-2 focus:border-transparent w-full"
            />
            <img
              src="../../public/Password.svg"
              alt="password"
              class="absolute right-3 top-1/2 transform -translate-y-1/2 cursor-pointer"
              onclick="togglePasswordIcon()"
            />
        </div>
        <div class="mt-6">
          <label class="block text-sm text-gray-800 pb-1">Enter password</label>
          <div >
            <input
              type="password"
              id="passwordInput"
              placeholder="Enter confirmation password"
              class="rounded-lg focus:ring-[#28AA63] border-gray-300 py-2 px-4 border focus:outline-none focus:ring-2 focus:border-transparent w-full"
            />
            <img
              src="../../public/Password.svg"
              alt="password"
              class="absolute right-3 top-1/2 transform -translate-y-1/2 cursor-pointer"
              onclick="togglePasswordIcon()"
            />
          </div>

        </div>
        <div>
          <button
            type="submit"
            class="bg-[#28AA63] w-full text-white py-2 rounded-lg hover:bg-green-600 focus:ring-green-500 mt-6"
          >
            Reset Password
          </button>
        </div>
      </form>
    </div>

    <script>
      function togglePasswordIcon() {
        const passwordInput = document.getElementById('passwordInput')
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text'
        } else passwordInput.type = 'password'
      }
    </script>
  </body>
</html>
