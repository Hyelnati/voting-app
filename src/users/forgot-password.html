<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-[#28AA63] h-screen flex justify-center items-center">
    <div class="bg-white rounded-lg shadow-lg p-8 max-w-w-[470px] mx-4">
      <img class="pb-5 mx-auto h-10" src="../../public/Voter..png" alt="logo" />
      <div
        class="gap-7 text-center mt-3 mb-10 font-basis-grotesque leading-[26px]"
      >
        <h1 class="font-bold font text-2xl tracking[-0.01em]">Verify OTP</h1>
        <h1 class="mt-1">
          We’ve sent a verification code to:
          <span class="text-[#28AA63]">08119116045</span>
        </h1>
      </div>

      <form action="" class="mt-5">
        <div class="flex justify-between">
          <input
            type="text"
            maxlength="1"
            id="otp1"
            class="border rounded-lg border-gray-300 focus:outline-none focus:ring-2 w-12 h-12 text-center"
            oninput="moveToNext(this, 'otp2')"
          />
          <input
            type="text"
            maxlength="1"
            id="otp2"
            class="border rounded-lg border-gray-300 focus:outline-none focus:ring-2 w-12 h-12 text-center"
            oninput="moveToNext(this, 'otp3')"
          />
          <input
            type="text"
            maxlength="1"
            id="otp3"
            class="border rounded-lg border-gray-300 focus:outline-none focus:ring-2 w-12 h-12 text-center"
            oninput="moveToNext(this, 'otp4')"
          />
          <input
            type="text"
            maxlength="1"
            id="otp4"
            class="border rounded-lg border-gray-300 focus:outline-none focus:ring-2 w-12 h-12 text-center"
            oninput="moveToNext(this, 'otp5')"
          />
          <input
            type="text"
            maxlength="1"
            id="otp5"
            class="border rounded-lg border-gray-300 focus:outline-none focus:ring-2 w-12 h-12 text-center"
            oninput="moveToNext(this, 'otp6')"
          />
          <input
            type="text"
            maxlength="1"
            id="otp6"
            class="border rounded-lg border-gray-300 focus:outline-none focus:ring-2 w-12 h-12 text-center"
            oninput="moveToNext(this, 'otp7')"
          />
        </div>

        <div>
          <button
            type="submit"
            class="bg-[#A9DDC1] w-full text-white py-2 rounded-lg hover:bg-green-600 focus:ring-green-500 mt-6"
          >
            Verify code
          </button>
        </div>
        <div class="mt-3 text-center">
          <h1>
            Didn't receive code?
            <span class="text-[#D34829] cursor-pointer underline">Resend</span>
          </h1>
        </div>
      </form>
    </div>
    <script>
      function moveToNext(currentInput, nextInputId) {
        if (currentInput.value.length === 1) {
          document.getElementById(nextInputId).focus()
        }
      }

      function moveBackward(event, currentInput, previousInputId) {
        if (event.key === 'Backspace' && currentInput.value.length === 0) {
          document.getElementById(previousInputId).focus()
        }
      }
    </script>
  </body>
</html>
