<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@font-face {
  font-family: "ExtraBold";
  src: url("../font/Poppins-ExtraBold.ttf");
  
}</style>
  </head>
  <body class="bg-[#28AA63] h-screen flex justify-center items-center">
    <div class="bg-white rounded-lg shadow-lg p-8 max-w-w-[470px] mx-4">
      <img class="pb-5 mx-auto h-10" src="../../public/Voter..png" alt="logo" />
      <div
        class="gap-7 text-center mt-3 mb-10 font-basis-grotesque leading-[26px]"
      >
        <h1 class="font-bold text-2xl tracking[-0.01em]">Sign in</h1>
        <h1 class=" font-ExtraBold ">Enter credentials to access your account</h1>
      </div>

      <form action="" class="mt-5">
        <div>
          <label class="block text-sm text-gray-800 pb-1"
            >Phone number or username</label
          >
          <input
            type="text"
            placeholder="Enter phone number or username"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#28AA63] focus:border-transparent"
          />
        </div>
        <div class="mt-6">
          <label class="block text-sm text-gray-800 pb-1 font-customBold">Password</label>
          <div >
            <input
              type="password"
              id="passwordInput"
              placeholder="Enter password"
              class="rounded-lg focus:ring-[#28AA63] border-gray-300 py-2 px-4 border focus:outline-none focus:ring-2 focus:border-transparent w-full"
            />
           
    
          </div>

        <div>
          <button
            type="submit"
            class="w-full bg-[#28AA63] font-customBold text-white py-2 rounded-lg hover:bg-green-600 focus:ring-2 focus:ring-green-500 mt-6"
          >
            Sign in
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
