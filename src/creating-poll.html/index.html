<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <main class="flex flex-col gap-y-4">
      <header
        class="flex px-14 justify-between items-center py-[10px] border-2 border-b-[#a8f0c8] sticky"
      >
        <img class="h-7 w-[6.5rem]" src="../../public/Voter..png" alt="logo" />
        <div class="flex items-center gap-4">
          <img src="../../public/Avatars.svg" alt="" />
          <h1 style="font-weight: 500">
            Michael Henry <br />
            <span style="font-weight: 100">@admin user</span>
          </h1>
          <div class="ml-4">
            <button
              class="text-[#E02424] bg-transparent border border-[#E02424] rounded-xl px-6 py-2 relative flex items-center gap-x-2 cursor-pointer"
            >
              <img class="" src="../../public/Log in.svg" alt="" />
              Sign Out
            </button>
          </div>
        </div>
      </header>
      <section class="px-14 py-5 flex justify-between items-center">
        <div class="gap-3 flex">
          <button class="text-[#28AA63] rounded-xl p-2 gap-x-2 bg-[#EAFBF2]">
            Polls
          </button>
          <button>All Users</button>
        </div>
        <button
          class="relative flex items-center gap-x-2 cursor-pointer bg-[#EAFBF2] text-[#28AA63] rounded-xl p-2"
        >
          Create new poll
          <img src="../../public/Group 427323531.svg" alt="" />
        </button>
      </section>

      <div class="flex items-center flex-col mt-32 gap-2">
        <img src="../../public/Empty States.svg" alt="" />
        <h1 class="font-bold">You have no polls yet</h1>
        <h1>
          Click on the create new poll button to start <br />
          <span class="flex justify-center items-center">creating polls</span>
        </h1>
      </div>
    </main>
  </body>
</html>
